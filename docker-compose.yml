# Deployment stack for the Ghanipur FRONTEND (Next.js).
#
# Caddy is the only service published on this machine. It serves
# https://SITE_DOMAIN with a free Let's Encrypt certificate it obtains and
# renews itself, redirects http and www to that origin, and proxies to the Next
# server over the compose network (see Caddyfile). Next is deliberately not
# published, so the app has one public entrypoint and it is https — nothing
# answers on <ip>:3000.
#
# The backend runs on a SEPARATE EC2 machine, so there is no shared Docker
# network: this Next server proxies /api/v1 and /uploads to the backend's
# address, set as BACKEND_ORIGIN in .env. The browser therefore only ever talks
# to this origin, which keeps the refresh cookie first-party (no CORS, no
# SameSite=None) — the backend is never contacted by the browser directly.
#
# BACKEND_ORIGIN is baked into the image: Next evaluates next.config's
# rewrites() during `next build`. Changing it needs `up -d --build`.

services:
  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        API_PROXY_TARGET: ${BACKEND_ORIGIN:?set BACKEND_ORIGIN in .env, e.g. http://10.0.1.20:5000}
    image: ghanipur-frontend:latest
    container_name: ghanipur-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      # SSR fetches run inside this container and go straight to the backend,
      # not through the browser's public URL. Read at runtime.
      INTERNAL_API_URL: ${BACKEND_ORIGIN}/api/v1
    # Reachable by caddy over the compose network only.
    expose:
      - "3000"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2-alpine
    container_name: ghanipur-caddy
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-ghanipur.pk}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Issued certificates and the ACME account. Losing this means re-issuing
      # on every deploy, which runs into Let's Encrypt's rate limits.
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  caddy_data:
  caddy_config:
